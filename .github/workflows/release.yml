name: Governed Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    # ci-workflows v1.0.0-initial. Update this SHA through a reviewed PR.
    uses: img2threejs/ci-workflows/.github/workflows/governed-tag-release.yml@66e4071913652d7ce9e0ad66709a5e4e66497e0d
    with:
      tag: ${{ github.ref_name }}
      version-file: SKILL.md
      bootstrap-release: ${{ github.ref_name == 'v1.4.3' }}
      # For the first governed tag this remains empty. Update it in the next release-prep PR.
      previous-governed-tag: ""
